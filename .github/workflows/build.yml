name: Build llama.cpp Expert Cache - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - Generic
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # 1. Checkout Expert Cache experimental branch
      # ------------------------------------------------------------
      - name: Checkout Expert Cache branch
        uses: actions/checkout@v6
        with:
          repository: csantiago78/llama.cpp
          ref: moe-expert-cache
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Patch Windows compatibility issue
      #
      # The experimental branch uses POSIX:
      #   flockfile()
      #   funlockfile()
      #
      # MSVC uses:
      #   _lock_file()
      #   _unlock_file()
      # ------------------------------------------------------------
      - name: Patch Expert Cache for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = "ggml\src\ggml-cpu\ggml-cpu.c"

          if (-not (Test-Path $path)) {
              throw "Cannot find $path"
          }

          $text = [System.IO.File]::ReadAllText($path)
          $changed = $false

          if ($text.Contains("flockfile(moe_log_file);")) {
              $text = $text.Replace(
                  "flockfile(moe_log_file);",
                  "_lock_file(moe_log_file);"
              )
              $changed = $true
              Write-Host "Patched flockfile -> _lock_file"
          }
          elseif ($text.Contains("_lock_file(moe_log_file);")) {
              Write-Host "_lock_file already present; no patch needed."
          }
          else {
              Write-Host "Warning: flockfile(moe_log_file) pattern not found."
          }

          if ($text.Contains("funlockfile(moe_log_file);")) {
              $text = $text.Replace(
                  "funlockfile(moe_log_file);",
                  "_unlock_file(moe_log_file);"
              )
              $changed = $true
              Write-Host "Patched funlockfile -> _unlock_file"
          }
          elseif ($text.Contains("_unlock_file(moe_log_file);")) {
              Write-Host "_unlock_file already present; no patch needed."
          }
          else {
              Write-Host "Warning: funlockfile(moe_log_file) pattern not found."
          }

          if ($changed) {
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText(
                  $path,
                  $text,
                  $utf8NoBom
              )

              Write-Host "Windows compatibility patch applied successfully."
          }

      # ------------------------------------------------------------
      # 3. Setup CUDA 13.3
      #
      # Uses llama.cpp's bundled Windows CUDA setup action.
      # ------------------------------------------------------------
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: x64

      # ------------------------------------------------------------
      # 4. Install Ninja
      # ------------------------------------------------------------
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      # ------------------------------------------------------------
      # 5. Configure generic Windows CUDA build
      #
      # GGML_NATIVE=OFF means:
      # - not tied to GitHub runner CPU
      # - CMake chooses a generic CUDA architecture set
      #
      # We intentionally do NOT set:
      # - CMAKE_CUDA_ARCHITECTURES=120
      # - AVX2-only CPU build
      # - AVX512-only CPU build
      # ------------------------------------------------------------
      - name: Configure generic Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_CURL=OFF

      # ------------------------------------------------------------
      # 6. Build useful executables only
      # ------------------------------------------------------------
      - name: Build llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1

          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1

          echo Using %NINJA_JOBS% parallel build jobs

          cmake --build build ^
            --config Release ^
            -j %NINJA_JOBS% ^
            --target llama-server llama-cli llama-bench

      # ------------------------------------------------------------
      # 7. Verify build outputs
      # ------------------------------------------------------------
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "ggml-cuda.dll",
              "ggml-cpu.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host "Contents of ${bin}:"
                  Get-ChildItem $bin |
                      Format-Table Name, Length

                  throw "Required build output missing: $file"
              }

              Write-Host "Found: $file"
          }

      # ------------------------------------------------------------
      # 8. Bundle CUDA runtime DLLs
      #
      # Recursive search is required because llama.cpp's CUDA setup
      # action installs CUDA libraries in nested archive directories.
      #
      # This lets the downloaded build run without installing the
      # full CUDA Toolkit locally.
      #
      # A recent NVIDIA driver is still required.
      # ------------------------------------------------------------
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host "CUDA_PATH = $cudaRoot"
          Write-Host "Searching CUDA runtime DLLs recursively..."

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA runtime DLL matching: $pattern"
              }

              foreach ($file in $files) {
                  Write-Host "Found: $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Bundled: $($file.Name)"
              }
          }

          Write-Host ""
          Write-Host "CUDA runtime DLLs bundled successfully:"
          Get-ChildItem $dest -Filter "*.dll" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize

      # ------------------------------------------------------------
      # 9. Add build information
      # ------------------------------------------------------------
      - name: Add build information
        shell: pwsh
        run: |
          $dest = "build\bin\Release"

          $commit = git rev-parse HEAD
          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          llama.cpp Expert Cache experimental build

          Source:
          https://github.com/csantiago78/llama.cpp

          Branch:
          moe-expert-cache

          Commit:
          $commit

          Platform:
          Windows x64

          CUDA:
          13.3

          Build mode:
          Generic
          GGML_NATIVE=OFF

          Built:
          $date

          Windows compatibility patch:
          flockfile   -> _lock_file
          funlockfile -> _unlock_file
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8

      # ------------------------------------------------------------
      # 10. Show final package contents
      # ------------------------------------------------------------
      - name: Show package contents
        shell: pwsh
        run: |
          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize

      # ------------------------------------------------------------
      # 11. Upload artifact
      #
      # "if: always()" is intentional:
      # if a late packaging step fails, GitHub will still try to
      # upload already-compiled executables.
      # ------------------------------------------------------------
      - name: Upload Windows CUDA build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-expert-cache-win-x64-cuda133-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: error
