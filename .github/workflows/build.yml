name: Build llama.cpp Expert Cache - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - Generic
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout Expert Cache experimental branch
      # ============================================================
      - name: Checkout Expert Cache branch
        uses: actions/checkout@v6
        with:
          repository: csantiago78/llama.cpp
          ref: moe-expert-cache
          fetch-depth: 1

      # ============================================================
      # 2. Patch Windows compatibility
      #
      # Experimental branch currently uses:
      #   flockfile()
      #   funlockfile()
      #
      # MSVC equivalents:
      #   _lock_file()
      #   _unlock_file()
      #
      # If upstream fixes this later, this step simply skips it.
      # ============================================================
      - name: Patch Expert Cache for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $path = "ggml\src\ggml-cpu\ggml-cpu.c"

          if (-not (Test-Path $path)) {
              throw "Cannot find $path"
          }

          $text = [System.IO.File]::ReadAllText($path)
          $changed = $false

          if ($text.Contains("flockfile(moe_log_file);")) {
              $text = $text.Replace(
                  "flockfile(moe_log_file);",
                  "_lock_file(moe_log_file);"
              )

              $changed = $true
              Write-Host "Patched flockfile -> _lock_file"
          }
          elseif ($text.Contains("_lock_file(moe_log_file);")) {
              Write-Host "_lock_file already present. No patch needed."
          }
          else {
              Write-Host "flockfile pattern not found. Possibly fixed upstream."
          }

          if ($text.Contains("funlockfile(moe_log_file);")) {
              $text = $text.Replace(
                  "funlockfile(moe_log_file);",
                  "_unlock_file(moe_log_file);"
              )

              $changed = $true
              Write-Host "Patched funlockfile -> _unlock_file"
          }
          elseif ($text.Contains("_unlock_file(moe_log_file);")) {
              Write-Host "_unlock_file already present. No patch needed."
          }
          else {
              Write-Host "funlockfile pattern not found. Possibly fixed upstream."
          }

          if ($changed) {
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

              [System.IO.File]::WriteAllText(
                  $path,
                  $text,
                  $utf8NoBom
              )

              Write-Host "Windows compatibility patch applied."
          }

      # ============================================================
      # 3. Setup CUDA 13.3
      #
      # Uses the CUDA setup action bundled in llama.cpp.
      # ============================================================
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: x64

      # ============================================================
      # 4. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      # ============================================================
      # 5. Configure generic Windows CUDA build
      #
      # GGML_NATIVE=OFF:
      #   Do not optimize for GitHub runner CPU.
      #
      # No CMAKE_CUDA_ARCHITECTURES override:
      #   Let llama.cpp choose its generic supported CUDA arch set.
      #
      # CURL=OFF:
      #   Avoid extra libcurl dependencies.
      #
      # OPENSSL=OFF:
      #   Avoid:
      #     libcrypto-3-x64.dll
      #     libssl-3-x64.dll
      # ============================================================
      - name: Configure generic Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_CURL=OFF ^
            -DLLAMA_OPENSSL=OFF

      # ============================================================
      # 6. Build
      #
      # Only build tools useful for normal inference / testing.
      # ============================================================
      - name: Build llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo CPU threads available: %NUMBER_OF_PROCESSORS%

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

      # ============================================================
      # 7. Verify build outputs
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "llama-common.dll",
              "llama-server-impl.dll",
              "llama-cli-impl.dll",
              "llama-bench-impl.dll",
              "mtmd.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "Current build directory contents:"
                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }

      # ============================================================
      # 8. Bundle CUDA runtime DLLs
      #
      # llama.cpp CUDA setup puts runtime components in nested
      # directories, so search recursively.
      #
      # This allows the downloaded package to run without installing
      # the full CUDA Toolkit locally.
      #
      # A sufficiently recent NVIDIA driver is still required.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host "CUDA_PATH = $cudaRoot"

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching for $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA runtime DLL matching: $pattern"
              }

              foreach ($file in $files) {
                  Write-Host "Found: $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Copied: $($file.Name)"
              }
          }

      # ============================================================
      # 9. Verify CUDA DLLs are packaged
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $found = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $found) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $found) {
                  Write-Host "[OK] $($file.Name)"
              }
          }

      # ============================================================
      # 10. Verify OpenSSL DLLs are not required/package leftovers
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }

      # ============================================================
      # 11. Add build information
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $dest = "build\bin\Release"

          $commit = git rev-parse HEAD
          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          llama.cpp Expert Cache experimental build

          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/csantiago78/llama.cpp

          Branch:
          moe-expert-cache

          Commit:
          $commit


          ============================================================
          Platform
          ============================================================

          Windows x64

          CUDA:
          13.3

          Build mode:
          Generic

          GGML_NATIVE:
          OFF

          CURL:
          OFF

          OpenSSL:
          OFF


          ============================================================
          Windows compatibility patch
          ============================================================

          flockfile
          ->
          _lock_file

          funlockfile
          ->
          _unlock_file


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8

      # ============================================================
      # 12. Show final package contents
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Final package:"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize

      # ============================================================
      # 13. Smoke test executables
      #
      # IMPORTANT:
      # Standard GitHub Windows runners do not have a usable NVIDIA
      # GPU, so messages such as:
      #
      #   ggml_cuda_init: failed to initialize CUDA
      #
      # are EXPECTED here.
      #
      # We only verify that Windows can load and start the executables.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-server.exe"
              Write-Host "========================================"

              & .\llama-server.exe --version

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-server.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-cli.exe"
              Write-Host "========================================"

              & .\llama-cli.exe --version

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-cli.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-bench.exe"
              Write-Host "========================================"

              & .\llama-bench.exe --help

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-bench.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "ALL EXECUTABLE SMOKE TESTS PASSED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 14. Upload Artifact
      #
      # always() is intentional.
      #
      # If a late smoke-test or packaging step fails, GitHub will
      # still try to upload the compiled files for diagnosis.
      # ============================================================
      - name: Upload Windows CUDA build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-expert-cache-win-x64-cuda133-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: error
