name: Build Leloch llama.cpp MoE Cache v2 - Windows CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - Leloch MoE Cache v2
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout latest leloch MoE Cache v2 branch
      #
      # Every new workflow run pulls the current HEAD of:
      #
      #   leloch/llama.cpp:moe-cache-v2-pr
      #
      # This branch implements adaptive runtime MoE expert caching.
      # No offline CSV/profile is required.
      # ============================================================
      - name: Checkout Leloch MoE Cache v2
        uses: actions/checkout@v6
        with:
          repository: leloch/llama.cpp
          ref: moe-cache-v2-pr
          fetch-depth: 1


      # ============================================================
      # 2. Show exact source revision
      # ============================================================
      - name: Show source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Source"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "https://github.com/leloch/llama.cpp"

          Write-Host ""
          Write-Host "Branch:"
          Write-Host "moe-cache-v2-pr"

          Write-Host ""
          Write-Host "Commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Latest commit:"
          git log -1 --oneline


      # ============================================================
      # 3. Setup CUDA 13.3
      #
      # IMPORTANT:
      #
      # This uses the CUDA setup action contained in the checked-out
      # Leloch branch itself.
      #
      # That action currently supports CUDA 13.3 x64.
      # ============================================================
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'


      # ============================================================
      # 4. Verify CUDA installation
      #
      # Prevent the workflow from reaching CMake if the CUDA setup
      # action did not actually install/configure nvcc.
      # ============================================================
      - name: Verify CUDA installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CUDA environment"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          Write-Host ""

          if (-not $env:CUDA_PATH) {
              throw "CUDA_PATH is not set."
          }

          if (-not (Test-Path $env:CUDA_PATH)) {
              throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

          $nvcc = Get-Command nvcc -ErrorAction Stop

          Write-Host "nvcc:"
          Write-Host $nvcc.Source

          Write-Host ""
          nvcc --version

          if ($LASTEXITCODE -ne 0) {
              throw "nvcc --version failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] CUDA installation verified."


      # ============================================================
      # 5. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version


      # ============================================================
      # 6. Configure generic Windows CUDA build
      #
      # GGML_CUDA=ON
      #   Enable NVIDIA CUDA backend.
      #
      # GGML_NATIVE=OFF
      #   Do not optimize for the GitHub runner CPU.
      #
      # LLAMA_OPENSSL=OFF
      #   Avoid OpenSSL DLL dependencies.
      #
      # LLAMA_BUILD_TESTS=OFF
      #   Avoid spending build time on tests.
      #
      # IMPORTANT:
      #
      # No special compile option is required for --moe-cache.
      # The MoE cache implementation is part of this branch.
      #
      # We deliberately do NOT wrap NVCC with sccache because of
      # previously encountered PTX / "Missing cubin file output"
      # problems with CUDA compilation.
      # ============================================================
      - name: Configure Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build environment
          echo ========================================
          echo.

          echo CUDA_PATH=%CUDA_PATH%
          echo.

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version
          if errorlevel 1 exit /b 1

          echo.
          cmake --version

          echo.
          ninja --version

          echo.
          echo ========================================
          echo Configure CMake
          echo ========================================
          echo.

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_OPENSSL=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%"

          if errorlevel 1 exit /b 1


      # ============================================================
      # 7. Build
      #
      # Build the binaries normally useful for inference and
      # performance testing.
      # ============================================================
      - name: Build llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Building
          echo ========================================
          echo.

          echo CPU threads available: %NUMBER_OF_PROCESSORS%
          echo.

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

          if errorlevel 1 exit /b 1


      # ============================================================
      # 8. Verify essential output files
      #
      # Only check stable/core names.
      #
      # Experimental branches may change internal *-impl.dll names.
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          if (-not (Test-Path $bin)) {
              throw "Build directory does not exist: $bin"
          }

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Current build directory"
                  Write-Host "========================================"
                  Write-Host ""

                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }


      # ============================================================
      # 9. Verify adaptive MoE Cache exists
      #
      # Search the source itself.
      #
      # This avoids treating an unusual --help exit code as a build
      # failure while still confirming we really built the intended
      # experimental branch.
      # ============================================================
      - name: Verify adaptive MoE Cache source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Verify adaptive MoE Cache"
          Write-Host "========================================"
          Write-Host ""

          $argFile = "common\arg.cpp"

          if (-not (Test-Path $argFile)) {
              throw "Cannot find $argFile"
          }

          $text = [System.IO.File]::ReadAllText($argFile)

          if (-not $text.Contains('"--moe-cache"')) {
              throw "This source revision does not expose --moe-cache"
          }

          if (-not $text.Contains("adaptively cache the hottest")) {
              Write-Host "Warning: --moe-cache exists but description changed."
          }

          Write-Host "[OK] --moe-cache detected in source."


      # ============================================================
      # 10. Bundle CUDA runtime DLLs
      #
      # Target PC should not need the full CUDA Toolkit.
      #
      # It still requires a sufficiently recent NVIDIA driver.
      #
      # Required:
      #   cudart
      #   cublas
      #   cublasLt
      #
      # Optional runtime components are also copied when present.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bundle CUDA runtime"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $cudaRoot"

          if (-not $cudaRoot) {
              throw "CUDA_PATH is empty."
          }

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }


          # --------------------------------------------------------
          # Required DLLs
          # --------------------------------------------------------
          $requiredPatterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $requiredPatterns) {
              Write-Host ""
              Write-Host "Searching required DLL:"
              Write-Host "  $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find required CUDA DLL: $pattern"
              }

              $uniqueFiles = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $uniqueFiles) {
                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "[COPIED] $($file.Name)"
              }
          }


          # --------------------------------------------------------
          # Optional CUDA runtime DLLs
          #
          # Some revisions/features may use these.
          # Copy them when available, but don't fail if absent.
          # --------------------------------------------------------
          $optionalPatterns = @(
              "nvrtc64_*.dll",
              "nvrtc-builtins64_*.dll",
              "nvJitLink_*.dll"
          )

          foreach ($pattern in $optionalPatterns) {
              Write-Host ""
              Write-Host "Searching optional DLL:"
              Write-Host "  $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  Write-Host "Not found. Continuing."
                  continue
              }

              $uniqueFiles = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $uniqueFiles) {
                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "[COPIED] $($file.Name)"
              }
          }


      # ============================================================
      # 11. Verify required CUDA runtime DLLs
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $files = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $files) {
                  Write-Host "[OK] $($file.Name)"
              }
          }


      # ============================================================
      # 12. Save exact command-line help
      #
      # This experimental branch can change CLI options over time.
      #
      # Save --help with the artifact so the exact options supported
      # by the downloaded build can always be inspected later.
      #
      # A nonzero --help exit code is informational only.
      # ============================================================
      - name: Save command line help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "Saving llama-server help..."

              & .\llama-server.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-SERVER-HELP.txt" `
                      -Encoding utf8

              Write-Host "Exit code: $LASTEXITCODE"


              Write-Host ""
              Write-Host "Saving llama-cli help..."

              & .\llama-cli.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-CLI-HELP.txt" `
                      -Encoding utf8

              Write-Host "Exit code: $LASTEXITCODE"


              Write-Host ""
              Write-Host "Saving llama-bench help..."

              & .\llama-bench.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-BENCH-HELP.txt" `
                      -Encoding utf8

              Write-Host "Exit code: $LASTEXITCODE"
          }
          finally {
              Pop-Location
          }

          $global:LASTEXITCODE = 0
          exit 0


      # ============================================================
      # 13. Extract MoE Cache help lines
      #
      # Makes it easy to inspect the cache options after download.
      # ============================================================
      - name: Save MoE Cache options
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $bin = "build\bin\Release"
          $helpFile = Join-Path $bin "LLAMA-SERVER-HELP.txt"
          $outFile = Join-Path $bin "MOE-CACHE-OPTIONS.txt"

          if (-not (Test-Path $helpFile)) {
              "Could not generate llama-server help." |
                  Out-File $outFile -Encoding utf8

              exit 0
          }

          $lines = Get-Content $helpFile

          $matches = $lines |
              Select-String `
                  -Pattern "moe-cache|cpu-moe|n-cpu-moe" `
                  -Context 1,3

          @"
          Leloch llama.cpp MoE Cache v2

          Relevant command-line options from this exact build:

          ============================================================

          $($matches | Out-String)
          "@ | Out-File `
              -FilePath $outFile `
              -Encoding utf8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MoE Cache options"
          Write-Host "========================================"
          Write-Host ""

          Get-Content $outFile

          exit 0


      # ============================================================
      # 14. Check OpenSSL runtime
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }


      # ============================================================
      # 15. Add BUILD-INFO.txt
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"

          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = (git rev-parse --short HEAD).Trim()
          $commitInfo = git log -1 --pretty=format:"%h %s"

          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          Leloch llama.cpp MoE Cache v2 experimental build


          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/leloch/llama.cpp

          Branch:
          moe-cache-v2-pr

          Commit:
          $commit

          Short commit:
          $shortCommit

          Commit description:
          $commitInfo


          ============================================================
          Platform
          ============================================================

          Windows:
          x64

          Runner:
          windows-2022

          Build:
          Release

          CUDA:
          13.3

          GGML_CUDA:
          ON

          GGML_NATIVE:
          OFF

          OpenSSL:
          OFF


          ============================================================
          Adaptive MoE Expert Cache
          ============================================================

          This build contains Leloch's adaptive runtime MoE expert
          cache.

          No offline CSV routing profile is required.

          Relevant option:

          --moe-cache MODE


          MODE examples:

          auto
              Automatically use spare VRAM while preserving normal
              weight repacking behavior.

          on
              Enable adaptive cache with an automatically selected
              VRAM budget.

          off
          0
              Disable MoE expert cache.

          N
              Explicit VRAM cache budget in MiB PER DEVICE.

              Example:

              --moe-cache 12000

              means approximately 12000 MiB cache budget per GPU,
              subject to the cache's actual available-VRAM limits.


          The cache dynamically learns which CPU-resident experts are
          hot while inference is running and caches them in VRAM.


          ============================================================
          Useful starting configuration
          ============================================================

          For a MoE model:

          -ngl all
          -ncmoe 99
          --moe-cache auto


          Alternatively specify the cache budget manually:

          -ngl all
          -ncmoe 99
          --moe-cache 12000


          Always leave enough VRAM for:

          KV cache
          compute buffers
          CUDA runtime
          context growth


          ============================================================
          CUDA runtime
          ============================================================

          CUDA runtime DLLs are bundled with this package.

          A full CUDA Toolkit installation on the destination machine
          should therefore not be required.

          A sufficiently recent NVIDIA driver is still required.


          ============================================================
          Files
          ============================================================

          LLAMA-SERVER-HELP.txt
              Complete server help from this exact build.

          LLAMA-CLI-HELP.txt
              Complete CLI help.

          LLAMA-BENCH-HELP.txt
              Benchmark help.

          MOE-CACHE-OPTIONS.txt
              Extracted MoE-related options.


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8


      # ============================================================
      # 16. Show final package contents
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final package"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize


      # ============================================================
      # 17. Smoke test executables
      #
      # GitHub-hosted Windows runners do NOT have a usable NVIDIA
      # GPU.
      #
      # Therefore this primarily verifies:
      #
      #   - executable starts
      #   - Windows DLL loader succeeds
      #   - packaged dependencies are present
      #
      # Small positive exit codes are tolerated because experimental
      # builds can behave differently when no GPU is present.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              function Test-LlamaExecutable {
                  param(
                      [Parameter(Mandatory = $true)]
                      [string]$Exe
                  )

                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Testing $Exe"
                  Write-Host "========================================"
                  Write-Host ""

                  if (-not (Test-Path $Exe)) {
                      throw "Executable does not exist: $Exe"
                  }

                  $output = (& $Exe --version 2>&1 | Out-String)
                  $code = $LASTEXITCODE

                  if ($output) {
                      Write-Host $output
                  }

                  Write-Host "Exit code: $code"

                  if ($code -eq 0) {
                      Write-Host "[OK] $Exe started successfully."
                      return
                  }

                  if ($code -ge 1 -and $code -le 10) {
                      Write-Host ""
                      Write-Host "Warning:"
                      Write-Host "$Exe started but returned exit code $code."
                      Write-Host "This is tolerated on the GPU-less GitHub runner."
                      return
                  }

                  throw "$Exe failed abnormally with exit code $code"
              }

              Test-LlamaExecutable ".\llama-server.exe"
              Test-LlamaExecutable ".\llama-cli.exe"
              Test-LlamaExecutable ".\llama-bench.exe"

              Write-Host ""
              Write-Host "========================================"
              Write-Host "EXECUTABLE LOAD TESTS COMPLETED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

          $global:LASTEXITCODE = 0
          exit 0


      # ============================================================
      # 18. Upload Artifact
      #
      # always() is intentional.
      #
      # If a late packaging/smoke-test step fails, GitHub still
      # attempts to upload useful compiled files for diagnosis.
      # ============================================================
      - name: Upload Windows CUDA MoE Cache build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-leloch-moe-cache-v2-win-x64-cuda133
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: warn
