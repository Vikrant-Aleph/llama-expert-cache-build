name: Build thecodacus llama.cpp Perf - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.4 - thecodacus perf
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout latest thecodacus perf branch
      #
      # Each workflow run pulls the current HEAD of:
      #   thecodacus/llama.cpp:perf
      # ============================================================
      - name: Checkout thecodacus perf branch
        uses: actions/checkout@v6
        with:
          repository: thecodacus/llama.cpp
          ref: perf
          fetch-depth: 1

      # ============================================================
      # 2. Show source revision
      # ============================================================
      - name: Show source revision
        shell: pwsh
        run: |
          Write-Host "Repository: thecodacus/llama.cpp"
          Write-Host "Branch: perf"
          Write-Host ""
          git log -1 --oneline
          git rev-parse HEAD

      # ============================================================
      # 3. Setup CUDA
      #
      # Use CUDA version supported by current llama.cpp Windows CI.
      # ============================================================
      - name: Setup CUDA 13.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: x64

      # ============================================================
      # 4. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      # ============================================================
      # 5. Configure generic Windows CUDA build
      #
      # GGML_CUDA=ON
      #   Enable NVIDIA CUDA backend.
      #
      # GGML_NATIVE=OFF
      #   Do not optimize specifically for GitHub runner CPU.
      #
      # LLAMA_OPENSSL=OFF
      #   Avoid OpenSSL DLL dependency.
      #
      # Expert-cache / prefetch features are runtime features.
      # They do NOT need special CMake build flags here.
      # ============================================================
      - name: Configure Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_OPENSSL=OFF

      # ============================================================
      # 6. Build
      # ============================================================
      - name: Build llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo CPU threads available: %NUMBER_OF_PROCESSORS%

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

      # ============================================================
      # 7. Verify essential outputs
      #
      # Avoid checking every internal "*-impl.dll" because those
      # names can change as the experimental branch tracks upstream.
      # Smoke tests below will catch missing runtime dependencies.
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          if (-not (Test-Path $bin)) {
              throw "Build directory does not exist: $bin"
          }

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "Current build directory contents:"

                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }

      # ============================================================
      # 8. Verify this really contains MoE expert-cache support
      #
      # perf is experimental, so fail clearly if the feature gets
      # renamed/removed from a future branch revision.
      # ============================================================
      - name: Verify MoE performance features
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "build\bin\Release"

          try {
              $help = (& .\llama-server.exe --help 2>&1 | Out-String)

              Write-Host "Searching llama-server help for MoE expert cache..."

              if ($help -match "moe-expert-cache") {
                  Write-Host "[OK] MoE expert-cache option detected."
              }
              else {
                  Write-Host ""
                  Write-Host "WARNING:"
                  Write-Host "Could not find 'moe-expert-cache' in llama-server --help."
                  Write-Host ""
                  Write-Host "The perf branch may have renamed its options."
                  Write-Host "Build will continue so the artifact can still be inspected."
              }
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 9. Bundle CUDA runtime DLLs
      #
      # Target machine does not need full CUDA Toolkit.
      # It still needs a sufficiently recent NVIDIA driver.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host "CUDA_PATH = $cudaRoot"

          if (-not $cudaRoot) {
              throw "CUDA_PATH is empty"
          }

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching for $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA DLL matching: $pattern"
              }

              # There can occasionally be duplicate copies in nested
              # toolkit directories. Package unique DLL names only.
              $files = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $files) {
                  Write-Host "Found: $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Copied: $($file.Name)"
              }
          }

      # ============================================================
      # 10. Verify CUDA DLLs
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $found = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $found) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $found) {
                  Write-Host "[OK] $($file.Name)"
              }
          }

      # ============================================================
      # 11. Check OpenSSL DLLs
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }

      # ============================================================
      # 12. Add build information
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $dest = "build\bin\Release"

          $commit = git rev-parse HEAD
          $shortCommit = git rev-parse --short HEAD

          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          thecodacus llama.cpp experimental performance build

          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/thecodacus/llama.cpp

          Branch:
          perf

          Commit:
          $commit

          Short commit:
          $shortCommit


          ============================================================
          Platform
          ============================================================

          Windows x64

          CUDA:
          13.4

          Build:
          Release

          GGML_CUDA:
          ON

          GGML_NATIVE:
          OFF

          OpenSSL:
          OFF


          ============================================================
          MoE performance branch
          ============================================================

          This package was built from:

          thecodacus/llama.cpp:perf

          Experimental MoE optimizations are controlled at runtime.
          Check the exact options supported by this build with:

          llama-server.exe --help
          llama-cli.exe --help
          llama-bench.exe --help


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8

      # ============================================================
      # 13. Show final package
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Final package:"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize

      # ============================================================
      # 14. Smoke test
      #
      # GitHub hosted Windows runners do not provide a usable
      # NVIDIA GPU. CUDA initialization failure is therefore expected.
      #
      # What matters here is that Windows can load all binaries/DLLs.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-server.exe"
              Write-Host "========================================"

              & .\llama-server.exe --version

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-server.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-cli.exe"
              Write-Host "========================================"

              & .\llama-cli.exe --version

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-cli.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-bench.exe"
              Write-Host "========================================"

              & .\llama-bench.exe --help

              $code = $LASTEXITCODE
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-bench.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "ALL EXECUTABLE SMOKE TESTS PASSED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 15. Upload Artifact
      # ============================================================
      - name: Upload Windows CUDA perf build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-thecodacus-perf-win-x64-cuda134-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: error
