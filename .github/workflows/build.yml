name: Build thecodacus llama.cpp Perf - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - thecodacus perf
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      # Enable GitHub Actions backed compiler cache.
      #
      # This allows successful C/C++/CUDA compilations to be reused
      # on later workflow runs even though GitHub-hosted runners use
      # a fresh VM for every job.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      # ============================================================
      # 1. Checkout latest thecodacus perf branch
      #
      # Every NEW workflow run pulls the current HEAD of:
      #
      #   thecodacus/llama.cpp:perf
      #
      # This intentionally tracks the moving experimental branch.
      # ============================================================
      - name: Checkout thecodacus perf branch
        uses: actions/checkout@v6
        with:
          repository: thecodacus/llama.cpp
          ref: perf
          fetch-depth: 1


      # ============================================================
      # 2. Show exact source revision
      # ============================================================
      - name: Show source revision
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = (git rev-parse --short HEAD).Trim()

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Source revision"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "thecodacus/llama.cpp"

          Write-Host ""
          Write-Host "Branch:"
          Write-Host "perf"

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $commit

          Write-Host ""
          git log -1 --oneline

          "commit=$commit" >> $env:GITHUB_OUTPUT
          "short_commit=$shortCommit" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 3. Setup CUDA 13.3
      #
      # The current thecodacus/perf revision being tested contains
      # an x64 CUDA 13.3 setup path.
      #
      # We deliberately use the action bundled with this fork.
      # ============================================================
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: x64


      # ============================================================
      # 4. Verify CUDA installation
      #
      # Fail early if the setup action did not actually install nvcc.
      # ============================================================
      - name: Verify CUDA installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CUDA environment"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          Write-Host ""

          if (-not $env:CUDA_PATH) {
              throw "CUDA_PATH is not set."
          }

          if (-not (Test-Path $env:CUDA_PATH)) {
              throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

          $nvcc = Get-Command nvcc -ErrorAction Stop

          Write-Host "nvcc:"
          Write-Host $nvcc.Source
          Write-Host ""

          nvcc --version

          if ($LASTEXITCODE -ne 0) {
              throw "nvcc --version failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] CUDA installation verified."


      # ============================================================
      # 5. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          Write-Host ""
          Write-Host "Ninja version:"
          ninja --version


      # ============================================================
      # 6. Setup sccache
      #
      # This is the "resume-like" compiler cache.
      #
      # GitHub-hosted runners are disposable, so a failed workflow
      # cannot literally resume on the same VM.
      #
      # sccache stores successful compiler results and allows later
      # workflow runs to reuse them.
      #
      # v0.18.0 contains CUDA 13.3 / Windows NVCC fixes.
      # ============================================================
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"


      # ============================================================
      # 7. Verify sccache
      # ============================================================
      - name: Verify sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "sccache"
          Write-Host "========================================"
          Write-Host ""

          $sccache = Get-Command sccache -ErrorAction Stop

          Write-Host "sccache location:"
          Write-Host $sccache.Source
          Write-Host ""

          sccache --version

          if ($LASTEXITCODE -ne 0) {
              throw "sccache --version failed."
          }

          Write-Host ""
          Write-Host "Initial cache statistics:"
          sccache --show-stats


      # ============================================================
      # 8. Configure generic Windows CUDA build
      #
      # GGML_CUDA=ON
      #   Enable NVIDIA CUDA backend.
      #
      # GGML_NATIVE=OFF
      #   Do not optimize for the GitHub runner CPU.
      #
      # LLAMA_CURL=OFF
      #   Avoid unnecessary curl runtime dependencies.
      #
      # LLAMA_OPENSSL=OFF
      #   Avoid OpenSSL runtime DLL dependencies.
      #
      # CMAKE_*_COMPILER_LAUNCHER=sccache
      #   Cache MSVC and NVCC compilation results between runs.
      # ============================================================
      - name: Configure Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build environment
          echo ========================================
          echo.

          echo CUDA_PATH=%CUDA_PATH%
          echo.

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version
          if errorlevel 1 exit /b 1

          echo.
          where sccache
          if errorlevel 1 exit /b 1

          sccache --version
          if errorlevel 1 exit /b 1

          echo.
          cmake --version
          ninja --version
          echo.

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_CURL=OFF ^
            -DLLAMA_OPENSSL=OFF ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache

          if errorlevel 1 exit /b 1


      # ============================================================
      # 9. Build
      #
      # If this step fails halfway through, successful compilation
      # units already handled by sccache can be reused on a later
      # NEW workflow run.
      # ============================================================
      - name: Build llama.cpp
        id: build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build
          echo ========================================
          echo.

          echo CPU threads available: %NUMBER_OF_PROCESSORS%
          echo.

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

          if errorlevel 1 exit /b 1


      # ============================================================
      # 10. Show sccache statistics
      #
      # always() means we still get useful cache information even
      # when the compiler fails.
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "sccache statistics"
          Write-Host "========================================"
          Write-Host ""

          sccache --show-stats

          exit 0


      # ============================================================
      # 11. Verify essential build outputs
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          if (-not (Test-Path $bin)) {
              throw "Build directory does not exist: $bin"
          }

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Current build directory contents"
                  Write-Host "========================================"
                  Write-Host ""

                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }


      # ============================================================
      # 12. Bundle CUDA runtime DLLs
      #
      # IMPORTANT:
      # Do this BEFORE running informational executable checks.
      #
      # The resulting artifact should not require a full CUDA Toolkit
      # installation on the destination machine.
      #
      # A sufficiently recent NVIDIA driver is still required.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bundle CUDA runtime"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $cudaRoot"
          Write-Host ""

          if (-not $cudaRoot) {
              throw "CUDA_PATH is empty."
          }

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching for $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA runtime DLL matching: $pattern"
              }

              # CUDA installation directories can contain duplicate
              # copies of the same DLL filename.
              #
              # Package only one copy of each unique filename.
              $uniqueFiles = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $uniqueFiles) {
                  Write-Host "Found:"
                  Write-Host "  $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Copied:"
                  Write-Host "  $($file.Name)"
              }
          }


      # ============================================================
      # 13. Verify packaged CUDA DLLs
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $found = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $found) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $found) {
                  Write-Host "[OK] $($file.Name)"
              }
          }


      # ============================================================
      # 14. Check OpenSSL runtime
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }


      # ============================================================
      # 15. Inspect MoE / Expert Cache related source markers
      #
      # IMPORTANT:
      #
      # This is intentionally INFORMATIONAL ONLY.
      #
      # The previous workflow incorrectly treated llama-server
      # --help returning exit code 1 as a build failure.
      #
      # We no longer allow a diagnostic feature inspection to fail
      # an otherwise successful 2+ hour compilation.
      # ============================================================
      - name: Inspect MoE performance feature markers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MoE / Expert Cache source inspection"
          Write-Host "========================================"
          Write-Host ""

          $patterns = @(
              "expert.cache",
              "expert_cache",
              "prefetch.*expert",
              "GGML_CUDA_REGISTER_HOST"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching source for:"
              Write-Host "  $pattern"
              Write-Host ""

              $result = git grep -n -i -E $pattern 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $result |
                      Select-Object -First 30 |
                      ForEach-Object {
                          Write-Host $_
                      }
              }
              else {
                  Write-Host "No matches found."
              }
          }

          Write-Host ""
          Write-Host "Feature inspection is informational only."

          # Explicitly clear any exit code left by git grep.
          $global:LASTEXITCODE = 0

          exit 0


      # ============================================================
      # 16. Save command-line help
      #
      # Some experimental builds return exit code 1 for --help.
      #
      # Therefore help generation is NEVER allowed to fail the job.
      # ============================================================
      - name: Save command line help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "Saving llama-server help..."

              & .\llama-server.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-SERVER-HELP.txt" `
                      -Encoding utf8

              $serverHelpCode = $LASTEXITCODE

              Write-Host "llama-server --help exit code: $serverHelpCode"
              Write-Host ""


              Write-Host "Saving llama-cli help..."

              & .\llama-cli.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-CLI-HELP.txt" `
                      -Encoding utf8

              $cliHelpCode = $LASTEXITCODE

              Write-Host "llama-cli --help exit code: $cliHelpCode"
              Write-Host ""


              Write-Host "Saving llama-bench help..."

              & .\llama-bench.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-BENCH-HELP.txt" `
                      -Encoding utf8

              $benchHelpCode = $LASTEXITCODE

              Write-Host "llama-bench --help exit code: $benchHelpCode"
          }
          finally {
              Pop-Location
          }

          # Help is informational.
          # Do not propagate native application's exit code.
          $global:LASTEXITCODE = 0

          exit 0


      # ============================================================
      # 17. Add BUILD-INFO.txt
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"

          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = (git rev-parse --short HEAD).Trim()
          $commitInfo = git log -1 --pretty=format:"%h %s"

          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          thecodacus llama.cpp experimental performance build


          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/thecodacus/llama.cpp

          Branch:
          perf

          Commit:
          $commit

          Short commit:
          $shortCommit

          Commit description:
          $commitInfo


          ============================================================
          Platform
          ============================================================

          Windows:
          x64

          Runner:
          windows-2022

          Build configuration:
          Release

          CUDA:
          13.3

          GGML_CUDA:
          ON

          GGML_NATIVE:
          OFF

          CURL:
          OFF

          OpenSSL:
          OFF


          ============================================================
          Compiler cache
          ============================================================

          sccache:
          enabled

          sccache backend:
          GitHub Actions cache

          C compiler cache:
          enabled

          C++ compiler cache:
          enabled

          CUDA/NVCC compiler cache:
          enabled


          ============================================================
          MoE performance branch
          ============================================================

          This package was built from:

          thecodacus/llama.cpp:perf


          This is an experimental performance branch.

          The exact Expert Cache / prefetch / pinned-memory behavior
          depends on the source commit listed above.

          Check:

          LLAMA-SERVER-HELP.txt
          LLAMA-CLI-HELP.txt
          LLAMA-BENCH-HELP.txt

          for command-line options exposed by this exact build.


          ============================================================
          CUDA runtime
          ============================================================

          CUDA runtime DLLs are bundled with this package.

          A complete CUDA Toolkit installation on the destination
          Windows machine should therefore not be required.

          A sufficiently recent NVIDIA driver is still required.


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8


      # ============================================================
      # 18. Show final package contents
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final package"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize


      # ============================================================
      # 19. Smoke test executables
      #
      # GitHub Windows hosted runners do not provide a usable NVIDIA
      # GPU.
      #
      # Therefore this test primarily verifies:
      #
      #   - EXE can be launched by Windows
      #   - DLL loading does not immediately fail
      #
      # Exit code 1 or 2 is tolerated because experimental binaries
      # can return a nonzero status when no usable CUDA GPU exists.
      #
      # Windows loader / crash style exit codes are still rejected.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              function Test-LlamaExecutable {
                  param(
                      [Parameter(Mandatory = $true)]
                      [string]$Exe
                  )

                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Testing $Exe"
                  Write-Host "========================================"
                  Write-Host ""

                  if (-not (Test-Path $Exe)) {
                      throw "Executable does not exist: $Exe"
                  }

                  $output = (& $Exe --version 2>&1 | Out-String)
                  $code = $LASTEXITCODE

                  if ($output) {
                      Write-Host $output
                  }

                  Write-Host "Exit code: $code"

                  # Normal successful execution.
                  if ($code -eq 0) {
                      Write-Host "[OK] $Exe started successfully."
                      return
                  }

                  # Small positive exit codes are tolerated here.
                  # They can occur when a hosted runner has no usable
                  # NVIDIA device or an experimental tool treats the
                  # selected informational option as non-success.
                  if ($code -ge 1 -and $code -le 10) {
                      Write-Host "Warning: $Exe started but returned $code."
                      Write-Host "This is tolerated on the GitHub hosted runner."
                      return
                  }

                  # Large / negative exit codes are typical of
                  # Windows loader failures, crashes or NTSTATUS codes.
                  throw "$Exe failed abnormally with exit code $code"
              }


              Test-LlamaExecutable ".\llama-server.exe"
              Test-LlamaExecutable ".\llama-cli.exe"
              Test-LlamaExecutable ".\llama-bench.exe"


              Write-Host ""
              Write-Host "========================================"
              Write-Host "EXECUTABLE LOAD TESTS COMPLETED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

          # Do not leave a tolerated native exit code as the final
          # PowerShell process exit code.
          $global:LASTEXITCODE = 0

          exit 0


      # ============================================================
      # 20. Upload Artifact
      #
      # always() is intentional.
      #
      # If compilation or a late packaging check fails, GitHub still
      # attempts to upload whatever useful files were generated.
      # ============================================================
      - name: Upload Windows CUDA perf build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-thecodacus-perf-win-x64-cuda133-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: warn
