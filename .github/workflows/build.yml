name: Build thecodacus llama.cpp Perf - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - thecodacus perf
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout latest thecodacus perf branch
      #
      # Each workflow run pulls the current HEAD of:
      #   thecodacus/llama.cpp:perf
      # ============================================================
      - name: Checkout thecodacus perf branch
        uses: actions/checkout@v6
        with:
          repository: thecodacus/llama.cpp
          ref: perf
          fetch-depth: 1

      # ============================================================
      # 2. Show exact source revision
      #
      # Useful because perf is an experimental moving branch.
      # BUILD-INFO.txt will also record this exact commit.
      # ============================================================
      - name: Show source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Repository: thecodacus/llama.cpp"
          Write-Host "Branch: perf"
          Write-Host ""

          git log -1 --oneline

          Write-Host ""
          Write-Host "Full commit:"
          git rev-parse HEAD

      # ============================================================
      # 3. Setup CUDA 13.3
      #
      # IMPORTANT:
      # The thecodacus/perf branch's bundled Windows CUDA setup
      # action supports CUDA 13.3 x64.
      #
      # CUDA 13.4 x64 was NOT supported by the revision tested,
      # causing the action to silently skip CUDA installation.
      # ============================================================
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: x64

      # ============================================================
      # 4. Verify CUDA installation
      #
      # Fail immediately if the CUDA setup action did not actually
      # install nvcc or configure CUDA_PATH.
      # ============================================================
      - name: Verify CUDA installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CUDA environment"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          Write-Host ""

          if (-not $env:CUDA_PATH) {
              throw "CUDA_PATH is not set. CUDA installation failed."
          }

          if (-not (Test-Path $env:CUDA_PATH)) {
              throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

          Write-Host "nvcc location:"
          Get-Command nvcc -ErrorAction Stop

          Write-Host ""
          Write-Host "nvcc version:"
          nvcc --version

          if ($LASTEXITCODE -ne 0) {
              throw "nvcc --version failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] CUDA installation verified."

      # ============================================================
      # 5. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          Write-Host ""
          Write-Host "Ninja version:"
          ninja --version

      # ============================================================
      # 6. Configure generic Windows CUDA build
      #
      # GGML_CUDA=ON
      #   Enable NVIDIA CUDA backend.
      #
      # GGML_NATIVE=OFF
      #   Do not optimize specifically for the GitHub runner CPU.
      #   This makes the package more portable between Windows PCs.
      #
      # CUDAToolkit_ROOT
      #   Explicitly tell CMake where CUDA was installed.
      #
      # LLAMA_OPENSSL=OFF
      #   Avoid unnecessary OpenSSL runtime DLL dependencies.
      #
      # Expert Cache / Prefetch / pinned host memory features are
      # runtime features in the perf branch and do not require a
      # special CMake option here.
      # ============================================================
      - name: Configure Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build environment
          echo ========================================
          echo.
          echo CUDA_PATH=%CUDA_PATH%
          echo.

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version
          if errorlevel 1 exit /b 1

          echo.
          cmake --version
          ninja --version
          echo.

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DLLAMA_OPENSSL=OFF

          if errorlevel 1 exit /b 1

      # ============================================================
      # 7. Build
      #
      # Build only the tools normally needed for inference,
      # server use and benchmarking.
      # ============================================================
      - name: Build llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo CPU threads available: %NUMBER_OF_PROCESSORS%
          echo.

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

          if errorlevel 1 exit /b 1

      # ============================================================
      # 8. Verify essential build outputs
      #
      # Only check stable/core filenames here.
      #
      # Experimental branches can rename internal implementation
      # DLLs, so we avoid requiring every *-impl.dll by name.
      #
      # The smoke tests later will catch missing DLL dependencies.
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          if (-not (Test-Path $bin)) {
              throw "Build directory does not exist: $bin"
          }

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Current build directory contents"
                  Write-Host "========================================"
                  Write-Host ""

                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }

      # ============================================================
      # 9. Inspect available MoE / Expert Cache options
      #
      # perf is a moving experimental branch.
      #
      # We search --help for relevant features but DO NOT fail the
      # build if a future revision renames the CLI options.
      # ============================================================
      - name: Inspect MoE performance features
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "Inspecting llama-server options"
              Write-Host "========================================"
              Write-Host ""

              $help = (& .\llama-server.exe --help 2>&1 | Out-String)

              $keywords = @(
                  "expert",
                  "moe",
                  "cache",
                  "prefetch"
              )

              foreach ($keyword in $keywords) {
                  Write-Host ""
                  Write-Host "Searching for: $keyword"

                  $matches = $help -split "`r?`n" |
                      Where-Object {
                          $_ -match [regex]::Escape($keyword)
                      }

                  if ($matches) {
                      foreach ($line in $matches) {
                          Write-Host $line
                      }
                  }
                  else {
                      Write-Host "No help entry found."
                  }
              }

              Write-Host ""
              Write-Host "Feature inspection completed."
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 10. Bundle CUDA runtime DLLs
      #
      # This allows the downloaded artifact to run without requiring
      # the full CUDA Toolkit on the target Windows machine.
      #
      # A sufficiently recent NVIDIA driver is still required.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host ""
          Write-Host "CUDA_PATH = $cudaRoot"

          if (-not $cudaRoot) {
              throw "CUDA_PATH is empty."
          }

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "Searching for $pattern"
              Write-Host "========================================"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA runtime DLL matching: $pattern"
              }

              # CUDA packages may contain duplicate copies of a DLL
              # in nested directories.
              #
              # Keep one file for each unique DLL filename.
              $uniqueFiles = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $uniqueFiles) {
                  Write-Host "Found:"
                  Write-Host "  $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Copied:"
                  Write-Host "  $($file.Name)"
              }
          }

      # ============================================================
      # 11. Verify CUDA DLLs are packaged
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $found = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $found) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $found) {
                  Write-Host "[OK] $($file.Name)"
              }
          }

      # ============================================================
      # 12. Check OpenSSL runtime
      #
      # OpenSSL is disabled during CMake configuration.
      # Warn if OpenSSL DLLs unexpectedly appear in the package.
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }

      # ============================================================
      # 13. Add build information
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"

          $commit = git rev-parse HEAD
          $shortCommit = git rev-parse --short HEAD

          $commitInfo = git log -1 --pretty=format:"%h %s"

          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          thecodacus llama.cpp experimental performance build


          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/thecodacus/llama.cpp

          Branch:
          perf

          Commit:
          $commit

          Short commit:
          $shortCommit

          Commit description:
          $commitInfo


          ============================================================
          Platform
          ============================================================

          Windows:
          x64

          Build configuration:
          Release

          CUDA:
          13.3

          GGML_CUDA:
          ON

          GGML_NATIVE:
          OFF

          OpenSSL:
          OFF


          ============================================================
          MoE performance branch
          ============================================================

          This package was built from:

          thecodacus/llama.cpp:perf


          This is an experimental performance branch.

          MoE Expert Cache, asynchronous expert prefetch,
          pinned host memory and related experimental optimizations
          may be controlled at runtime depending on the exact
          revision of the perf branch.


          Check the exact options supported by this build with:

          llama-server.exe --help

          llama-cli.exe --help

          llama-bench.exe --help


          ============================================================
          CUDA runtime
          ============================================================

          CUDA runtime DLLs are bundled in this directory.

          Installing the complete CUDA Toolkit on the target machine
          should therefore not be required.

          A sufficiently recent NVIDIA Windows driver is still
          required.


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8

      # ============================================================
      # 14. Save llama-server help
      #
      # Helpful because this experimental branch can change options.
      # The user can inspect the exact supported parameters without
      # needing to remember which commit was built.
      # ============================================================
      - name: Save command line help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Push-Location "build\bin\Release"

          try {
              & .\llama-server.exe --help 2>&1 |
                  Out-File `
                      -FilePath "LLAMA-SERVER-HELP.txt" `
                      -Encoding utf8

              & .\llama-cli.exe --help 2>&1 |
                  Out-File `
                      -FilePath "LLAMA-CLI-HELP.txt" `
                      -Encoding utf8

              & .\llama-bench.exe --help 2>&1 |
                  Out-File `
                      -FilePath "LLAMA-BENCH-HELP.txt" `
                      -Encoding utf8
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 15. Show final package contents
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final package"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize

      # ============================================================
      # 16. Smoke test executables
      #
      # Standard GitHub-hosted Windows runners do not provide a
      # usable NVIDIA GPU.
      #
      # CUDA initialization warnings/errors caused solely by the
      # absence of a physical NVIDIA GPU can therefore be expected.
      #
      # The goal here is primarily to verify that:
      #
      #   - Windows can load the executable.
      #   - Required DLLs are present.
      #   - The executable can start.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-server.exe"
              Write-Host "========================================"
              Write-Host ""

              & .\llama-server.exe --version

              $code = $LASTEXITCODE

              Write-Host ""
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-server.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-cli.exe"
              Write-Host "========================================"
              Write-Host ""

              & .\llama-cli.exe --version

              $code = $LASTEXITCODE

              Write-Host ""
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-cli.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "Testing llama-bench.exe"
              Write-Host "========================================"
              Write-Host ""

              & .\llama-bench.exe --help

              $code = $LASTEXITCODE

              Write-Host ""
              Write-Host "Exit code: $code"

              if ($code -ne 0) {
                  throw "llama-bench.exe failed with exit code $code"
              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "ALL EXECUTABLE SMOKE TESTS PASSED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

      # ============================================================
      # 17. Upload Artifact
      #
      # always() is intentional.
      #
      # If a late smoke test fails, GitHub will still attempt to
      # upload the compiled package for diagnosis.
      # ============================================================
      - name: Upload Windows CUDA perf build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-thecodacus-perf-win-x64-cuda133-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: error
