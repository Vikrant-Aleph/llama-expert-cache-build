name: Build thecodacus llama.cpp Perf - Windows CUDA Generic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 - CUDA 13.3 - thecodacus perf
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      # sccache is used ONLY for normal C/C++ compilation.
      #
      # IMPORTANT:
      # Do NOT use sccache as the CUDA/NVCC compiler launcher.
      #
      # sccache 0.18.0 currently has an open bug with llama.cpp's
      # default PTX-only compute_90 architecture:
      #
      #   Missing "cubin" file output
      #
      # CUDA therefore uses nvcc directly.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      # ============================================================
      # 1. Checkout latest thecodacus perf branch
      #
      # Every NEW workflow run pulls the current HEAD of:
      #
      #   thecodacus/llama.cpp:perf
      # ============================================================
      - name: Checkout thecodacus perf branch
        uses: actions/checkout@v6
        with:
          repository: thecodacus/llama.cpp
          ref: perf
          fetch-depth: 1


      # ============================================================
      # 2. Show exact source revision
      # ============================================================
      - name: Show source revision
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = (git rev-parse --short HEAD).Trim()

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Source revision"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Repository:"
          Write-Host "thecodacus/llama.cpp"

          Write-Host ""
          Write-Host "Branch:"
          Write-Host "perf"

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $commit

          Write-Host ""
          git log -1 --oneline

          "commit=$commit" >> $env:GITHUB_OUTPUT
          "short_commit=$shortCommit" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 3. Setup CUDA 13.3
      #
      # Use the CUDA setup action included with the perf branch.
      # This branch currently supports CUDA 13.3 x64.
      # ============================================================
      - name: Setup CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'
          cuda_arch: x64


      # ============================================================
      # 4. Verify CUDA installation
      # ============================================================
      - name: Verify CUDA installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "CUDA environment"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          Write-Host ""

          if (-not $env:CUDA_PATH) {
              throw "CUDA_PATH is not set."
          }

          if (-not (Test-Path $env:CUDA_PATH)) {
              throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

          Write-Host "nvcc location:"
          Get-Command nvcc -ErrorAction Stop

          Write-Host ""
          Write-Host "nvcc version:"
          nvcc --version

          if ($LASTEXITCODE -ne 0) {
              throw "nvcc --version failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] CUDA installation verified."


      # ============================================================
      # 5. Install Ninja
      # ============================================================
      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          Write-Host ""
          Write-Host "Ninja version:"
          ninja --version


      # ============================================================
      # 6. Setup sccache
      #
      # IMPORTANT:
      #
      # sccache is used ONLY for:
      #
      #   C
      #   C++
      #
      # CUDA/NVCC is deliberately NOT wrapped by sccache.
      # ============================================================
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"


      # ============================================================
      # 7. Verify sccache
      # ============================================================
      - name: Verify sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "sccache"
          Write-Host "========================================"
          Write-Host ""

          $sccache = Get-Command sccache -ErrorAction Stop

          Write-Host "sccache location:"
          Write-Host $sccache.Source

          Write-Host ""
          Write-Host "sccache version:"
          sccache --version

          if ($LASTEXITCODE -ne 0) {
              throw "sccache --version failed."
          }

          Write-Host ""
          Write-Host "Initial cache statistics:"
          sccache --show-stats


      # ============================================================
      # 8. Configure generic Windows CUDA build
      #
      # GGML_CUDA=ON
      #   Enable NVIDIA CUDA backend.
      #
      # GGML_NATIVE=OFF
      #   Do not optimize specifically for the GitHub runner CPU.
      #
      # LLAMA_CURL=OFF
      #   Avoid unnecessary curl dependencies.
      #
      # LLAMA_OPENSSL=OFF
      #   Avoid OpenSSL runtime DLL dependencies.
      #
      # CMAKE_C_COMPILER_LAUNCHER=sccache
      # CMAKE_CXX_COMPILER_LAUNCHER=sccache
      #
      #   Cache normal C/C++ compilation.
      #
      # IMPORTANT:
      #
      # There is intentionally NO:
      #
      #   CMAKE_CUDA_COMPILER_LAUNCHER=sccache
      #
      # CUDA must go directly through NVCC.
      # ============================================================
      - name: Configure Windows CUDA build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build environment
          echo ========================================
          echo.

          echo CUDA_PATH=%CUDA_PATH%
          echo.

          where nvcc
          if errorlevel 1 exit /b 1

          nvcc --version
          if errorlevel 1 exit /b 1

          echo.
          where sccache
          if errorlevel 1 exit /b 1

          sccache --version
          if errorlevel 1 exit /b 1

          echo.
          cmake --version
          ninja --version
          echo.

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_CURL=OFF ^
            -DLLAMA_OPENSSL=OFF ^
            -DCUDAToolkit_ROOT="%CUDA_PATH%" ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

          if errorlevel 1 exit /b 1


      # ============================================================
      # 9. Build
      #
      # CUDA is compiled directly by nvcc.
      #
      # This avoids the current sccache + PTX compute_90 bug.
      # ============================================================
      - name: Build llama.cpp
        id: build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          echo.
          echo ========================================
          echo Build
          echo ========================================
          echo.

          echo CPU threads available: %NUMBER_OF_PROCESSORS%
          echo.

          cmake --build build ^
            --config Release ^
            -j %NUMBER_OF_PROCESSORS% ^
            --target llama-server llama-cli llama-bench

          if errorlevel 1 exit /b 1


      # ============================================================
      # 10. Show sccache statistics
      #
      # Only C/C++ compilation is expected in the cache.
      #
      # CUDA cache entries should be zero because NVCC bypasses
      # sccache intentionally.
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "sccache statistics"
          Write-Host "========================================"
          Write-Host ""

          sccache --show-stats

          exit 0


      # ============================================================
      # 11. Verify essential build outputs
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          if (-not (Test-Path $bin)) {
              throw "Build directory does not exist: $bin"
          }

          $required = @(
              "llama-server.exe",
              "llama-cli.exe",
              "llama-bench.exe",
              "llama.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll"
          )

          foreach ($file in $required) {
              $full = Join-Path $bin $file

              if (-not (Test-Path $full)) {
                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Current build directory contents"
                  Write-Host "========================================"
                  Write-Host ""

                  Get-ChildItem $bin |
                      Sort-Object Name |
                      Format-Table Name, Length -AutoSize

                  throw "Required build output missing: $file"
              }

              Write-Host "[OK] $file"
          }


      # ============================================================
      # 12. Bundle CUDA runtime DLLs
      #
      # Allows the downloaded package to run without installing the
      # complete CUDA Toolkit on the destination PC.
      #
      # A sufficiently recent NVIDIA driver is still required.
      # ============================================================
      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"
          $cudaRoot = $env:CUDA_PATH

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bundle CUDA runtime"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "CUDA_PATH = $cudaRoot"

          if (-not $cudaRoot) {
              throw "CUDA_PATH is empty."
          }

          if (-not (Test-Path $cudaRoot)) {
              throw "CUDA_PATH does not exist: $cudaRoot"
          }

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching for $pattern"

              $files = Get-ChildItem `
                  -Path $cudaRoot `
                  -Recurse `
                  -File `
                  -Filter $pattern `
                  -ErrorAction SilentlyContinue

              if (-not $files) {
                  throw "Could not find CUDA runtime DLL matching: $pattern"
              }

              # CUDA installation directories can contain duplicate
              # copies of the same DLL filename.
              #
              # Keep one copy for each unique filename.
              $uniqueFiles = $files |
                  Group-Object Name |
                  ForEach-Object {
                      $_.Group | Select-Object -First 1
                  }

              foreach ($file in $uniqueFiles) {
                  Write-Host "Found:"
                  Write-Host "  $($file.FullName)"

                  Copy-Item `
                      -Path $file.FullName `
                      -Destination $dest `
                      -Force

                  Write-Host "Copied:"
                  Write-Host "  $($file.Name)"
              }
          }


      # ============================================================
      # 13. Verify packaged CUDA runtime DLLs
      # ============================================================
      - name: Verify CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bin = "build\bin\Release"

          $patterns = @(
              "cudart64_*.dll",
              "cublas64_*.dll",
              "cublasLt64_*.dll"
          )

          foreach ($pattern in $patterns) {
              $found = Get-ChildItem `
                  -Path $bin `
                  -Filter $pattern `
                  -File `
                  -ErrorAction SilentlyContinue

              if (-not $found) {
                  throw "Missing packaged CUDA DLL: $pattern"
              }

              foreach ($file in $found) {
                  Write-Host "[OK] $($file.Name)"
              }
          }


      # ============================================================
      # 14. Check OpenSSL runtime
      # ============================================================
      - name: Check OpenSSL runtime
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $opensslDlls = @(
              "libcrypto-3-x64.dll",
              "libssl-3-x64.dll"
          )

          foreach ($dll in $opensslDlls) {
              if (Test-Path (Join-Path $bin $dll)) {
                  Write-Host "Warning: unexpected OpenSSL DLL exists: $dll"
              }
              else {
                  Write-Host "[OK] Not packaged: $dll"
              }
          }


      # ============================================================
      # 15. Inspect MoE / Expert Cache source markers
      #
      # INFORMATIONAL ONLY.
      #
      # This step must never make a successful build fail.
      # ============================================================
      - name: Inspect MoE performance feature markers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MoE / Expert Cache source inspection"
          Write-Host "========================================"
          Write-Host ""

          $patterns = @(
              "expert.cache",
              "expert_cache",
              "prefetch.*expert",
              "GGML_CUDA_REGISTER_HOST"
          )

          foreach ($pattern in $patterns) {
              Write-Host ""
              Write-Host "Searching source for:"
              Write-Host "  $pattern"

              $result = git grep -n -i -E $pattern 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $result |
                      Select-Object -First 30 |
                      ForEach-Object {
                          Write-Host $_
                      }
              }
              else {
                  Write-Host "No matches found."
              }
          }

          Write-Host ""
          Write-Host "Feature inspection is informational only."

          $global:LASTEXITCODE = 0
          exit 0


      # ============================================================
      # 16. Save command-line help
      #
      # Some experimental builds return a nonzero exit code for
      # --help.
      #
      # This step is informational and must NOT fail the workflow.
      # ============================================================
      - name: Save command line help
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              Write-Host ""
              Write-Host "Saving llama-server help..."

              & .\llama-server.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-SERVER-HELP.txt" `
                      -Encoding utf8

              Write-Host "llama-server --help exit code: $LASTEXITCODE"


              Write-Host ""
              Write-Host "Saving llama-cli help..."

              & .\llama-cli.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-CLI-HELP.txt" `
                      -Encoding utf8

              Write-Host "llama-cli --help exit code: $LASTEXITCODE"


              Write-Host ""
              Write-Host "Saving llama-bench help..."

              & .\llama-bench.exe --help *>&1 |
                  Out-File `
                      -FilePath "LLAMA-BENCH-HELP.txt" `
                      -Encoding utf8

              Write-Host "llama-bench --help exit code: $LASTEXITCODE"
          }
          finally {
              Pop-Location
          }

          $global:LASTEXITCODE = 0

          exit 0


      # ============================================================
      # 17. Add BUILD-INFO.txt
      # ============================================================
      - name: Add build information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dest = "build\bin\Release"

          $commit = (git rev-parse HEAD).Trim()
          $shortCommit = (git rev-parse --short HEAD).Trim()

          $commitInfo = git log -1 --pretty=format:"%h %s"

          $date = (Get-Date).ToUniversalTime().ToString(
              "yyyy-MM-dd HH:mm:ss 'UTC'"
          )

          @"
          thecodacus llama.cpp experimental performance build


          ============================================================
          Source
          ============================================================

          Repository:
          https://github.com/thecodacus/llama.cpp

          Branch:
          perf

          Commit:
          $commit

          Short commit:
          $shortCommit

          Commit description:
          $commitInfo


          ============================================================
          Platform
          ============================================================

          Windows:
          x64

          Runner:
          windows-2022

          Build configuration:
          Release

          CUDA:
          13.3

          GGML_CUDA:
          ON

          GGML_NATIVE:
          OFF

          CURL:
          OFF

          OpenSSL:
          OFF


          ============================================================
          Compiler cache
          ============================================================

          sccache:
          enabled for C and C++ only

          CUDA/NVCC sccache:
          disabled

          Reason:

          sccache 0.18.0 has an open issue with llama.cpp's
          PTX-only compute_90 CUDA architecture.

          The failure appears as:

          Missing "cubin" file output

          CUDA compilation therefore uses NVCC directly.


          ============================================================
          MoE performance branch
          ============================================================

          This package was built from:

          thecodacus/llama.cpp:perf


          This is an experimental performance branch.

          The exact Expert Cache / prefetch / pinned-memory behavior
          depends on the source commit listed above.


          Check:

          LLAMA-SERVER-HELP.txt
          LLAMA-CLI-HELP.txt
          LLAMA-BENCH-HELP.txt

          for command-line options exposed by this exact build.


          ============================================================
          CUDA runtime
          ============================================================

          CUDA runtime DLLs are bundled with this package.

          Installing the complete CUDA Toolkit on the destination
          Windows machine should therefore not be required.

          A sufficiently recent NVIDIA driver is still required.


          ============================================================
          Build time
          ============================================================

          $date
          "@ | Out-File `
              -FilePath "$dest\BUILD-INFO.txt" `
              -Encoding utf8


      # ============================================================
      # 18. Show final package contents
      # ============================================================
      - name: Show final package contents
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Final package"
          Write-Host "========================================"
          Write-Host ""

          Get-ChildItem "build\bin\Release" |
              Sort-Object Name |
              Format-Table Name, Length -AutoSize


      # ============================================================
      # 19. Smoke test executables
      #
      # Standard GitHub Windows runners do not provide a usable
      # NVIDIA GPU.
      #
      # Therefore this is primarily a Windows executable/DLL load
      # test.
      #
      # Small positive exit codes are tolerated because experimental
      # builds can return nonzero when no CUDA device is available.
      # ============================================================
      - name: Smoke test executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          Push-Location "build\bin\Release"

          try {
              function Test-LlamaExecutable {
                  param(
                      [Parameter(Mandatory = $true)]
                      [string]$Exe
                  )

                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "Testing $Exe"
                  Write-Host "========================================"
                  Write-Host ""

                  if (-not (Test-Path $Exe)) {
                      throw "Executable does not exist: $Exe"
                  }

                  $output = (& $Exe --version 2>&1 | Out-String)
                  $code = $LASTEXITCODE

                  if ($output) {
                      Write-Host $output
                  }

                  Write-Host "Exit code: $code"

                  if ($code -eq 0) {
                      Write-Host "[OK] $Exe started successfully."
                      return
                  }

                  # Tolerate normal small nonzero exit codes.
                  if ($code -ge 1 -and $code -le 10) {
                      Write-Host "Warning: $Exe started but returned $code."
                      Write-Host "This is tolerated on the GitHub hosted runner."
                      return
                  }

                  # Large/negative codes are more likely to indicate
                  # loader failures, crashes or Windows NTSTATUS.
                  throw "$Exe failed abnormally with exit code $code"
              }

              Test-LlamaExecutable ".\llama-server.exe"
              Test-LlamaExecutable ".\llama-cli.exe"
              Test-LlamaExecutable ".\llama-bench.exe"

              Write-Host ""
              Write-Host "========================================"
              Write-Host "EXECUTABLE LOAD TESTS COMPLETED"
              Write-Host "========================================"
          }
          finally {
              Pop-Location
          }

          $global:LASTEXITCODE = 0

          exit 0


      # ============================================================
      # 20. Upload Artifact
      #
      # always() is intentional.
      #
      # If compilation or a late packaging check fails, GitHub still
      # attempts to upload any useful generated files.
      # ============================================================
      - name: Upload Windows CUDA perf build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llama-thecodacus-perf-win-x64-cuda133-generic
          path: build/bin/Release/*
          retention-days: 7
          if-no-files-found: warn
